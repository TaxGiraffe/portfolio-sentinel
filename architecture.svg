<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica,Arial,sans-serif">
  <rect width="1400" height="900" fill="#0d1117"/>
  <text x="700" y="60" fill="#e6edf3" font-size="34" font-weight="bold" text-anchor="middle">Portfolio Sentinel - architecture</text>
  <text x="700" y="95" fill="#8b949e" font-size="18" text-anchor="middle">A Strands agent that only speaks when something is verifiably broken</text>

  <!-- portfolio.json -->
  <rect x="60" y="180" width="240" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="180" y="218" fill="#e6edf3" font-size="20" font-weight="bold" text-anchor="middle">portfolio.json</text>
  <text x="180" y="245" fill="#8b949e" font-size="15" text-anchor="middle">20-100 client sites</text>

  <!-- Strands agent -->
  <rect x="420" y="140" width="380" height="620" rx="14" fill="#161b22" stroke="#f78166" stroke-width="3"/>
  <text x="610" y="180" fill="#f78166" font-size="24" font-weight="bold" text-anchor="middle">Strands Agent</text>
  <text x="610" y="208" fill="#8b949e" font-size="15" text-anchor="middle">Amazon Bedrock model</text>
  <text x="610" y="230" fill="#8b949e" font-size="15" text-anchor="middle">system prompt = judgment rules R1-R3</text>

  <!-- tool 1 -->
  <rect x="450" y="260" width="320" height="120" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="610" y="292" fill="#58a6ff" font-size="19" font-weight="bold" text-anchor="middle">@tool scan_portfolio</text>
  <text x="610" y="318" fill="#8b949e" font-size="14" text-anchor="middle">calls the defect auditor Actor</text>
  <text x="610" y="340" fill="#8b949e" font-size="14" text-anchor="middle">MCP via mcp.apify.com</text>
  <text x="610" y="362" fill="#8b949e" font-size="14" text-anchor="middle">REST fallback (run-sync)</text>

  <!-- tool 2 -->
  <rect x="450" y="410" width="320" height="120" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="610" y="442" fill="#58a6ff" font-size="19" font-weight="bold" text-anchor="middle">@tool diff_against_baseline</text>
  <text x="610" y="468" fill="#8b949e" font-size="14" text-anchor="middle">R1 inconclusive is never breakage</text>
  <text x="610" y="490" fill="#8b949e" font-size="14" text-anchor="middle">R2 presence alerts now; absence needs 2 sightings</text>
  <text x="610" y="512" fill="#8b949e" font-size="14" text-anchor="middle">R3 silence is the product</text>

  <!-- tool 3 -->
  <rect x="450" y="560" width="320" height="120" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="610" y="592" fill="#58a6ff" font-size="19" font-weight="bold" text-anchor="middle">@tool surface_to_human</text>
  <text x="610" y="618" fill="#8b949e" font-size="14" text-anchor="middle">called ONLY when a real</text>
  <text x="610" y="640" fill="#8b949e" font-size="14" text-anchor="middle">human decision is needed</text>
  <text x="610" y="662" fill="#8b949e" font-size="14" text-anchor="middle">writes ALERTS.md</text>

  <!-- Apify actor -->
  <rect x="950" y="240" width="360" height="160" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="1130" y="278" fill="#3fb950" font-size="19" font-weight="bold" text-anchor="middle">Apify Actor (MCP tool)</text>
  <text x="1130" y="304" fill="#e6edf3" font-size="15" text-anchor="middle">champ1918/local-business-website-auditor</text>
  <text x="1130" y="330" fill="#8b949e" font-size="14" text-anchor="middle">verifiable defects only - no scores</text>
  <text x="1130" y="352" fill="#8b949e" font-size="14" text-anchor="middle">marks unreadable pages INCONCLUSIVE</text>
  <text x="1130" y="374" fill="#8b949e" font-size="14" text-anchor="middle">htmlLength + rawTitle on every row</text>

  <!-- baseline store -->
  <rect x="950" y="430" width="360" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="1130" y="468" fill="#e6edf3" font-size="19" font-weight="bold" text-anchor="middle">sentinel_state.json</text>
  <text x="1130" y="494" fill="#8b949e" font-size="14" text-anchor="middle">last known state + absence sighting counts</text>

  <!-- human -->
  <rect x="950" y="580" width="360" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="1130" y="618" fill="#d29922" font-size="19" font-weight="bold" text-anchor="middle">Agency owner</text>
  <text x="1130" y="644" fill="#8b949e" font-size="14" text-anchor="middle">gets a client-ready note: what broke,</text>
  <text x="1130" y="666" fill="#8b949e" font-size="14" text-anchor="middle">10-second verification, next step</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8b949e"/></marker></defs>
  <line x1="300" y1="225" x2="420" y2="225" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="770" y1="320" x2="950" y2="320" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="770" y1="470" x2="950" y2="470" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="770" y1="620" x2="950" y2="640" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="700" y="840" fill="#8b949e" font-size="16" text-anchor="middle">No verified change = no interruption. The owner's attention is the scarcest resource in the system.</text>
</svg>
